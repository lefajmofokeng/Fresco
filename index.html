<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selected Works Component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="sw-component-wrapper">
    <div class="sw-header">
        <h1 class="sw-title">Selected works</h1>
        <p class="sw-subtitle">Explore our recent portfolio featuring bespoke residential renovations and award-winning commercial architecture designs tailored to modern living.</p>
    </div>

    <div class="sw-content-grid">
        
        <div class="sw-image-column">
            <div class="sw-main-image-wrapper">
                <img id="sw-main-display-img" class="sw-main-image" src="" alt="Project main view">
            </div>
            
            <div class="sw-image-footer-row">
                <a href="#" class="sw-browse-btn">Browse all portfolio</a>
                
                <div class="sw-thumbnails-wrapper" id="sw-thumbnails-container">
                    </div>
            </div>
        </div>

        <div class="sw-accordion-column" id="sw-accordion-container">
            </div>

    </div>
</div>

<script src="script.js"></script>

</body>
</html>
